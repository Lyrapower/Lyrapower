<!doctype html><html lang="en"><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b161c"><title>Night Shift · 港城夜班 V4.0</title><style>
:root{--ink:#f3e9d6;--dim:#b9c4c2;--gold:#e7c188;--goldd:#a98452;--sea:#9fe0d2;--bg:#0b161c;--glass:rgba(16,30,38,.62);--serif:Georgia,"Songti SC","STSong","Noto Serif CJK SC",serif;--sans:"DM Sans",system-ui,-apple-system,"PingFang SC",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace;--px:0;--py:0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
body{min-height:100dvh;overscroll-behavior-y:none}
.zh{display:block;font-size:.9em;opacity:.86}
small{font:600 11px/1.4 var(--mono);letter-spacing:.14em;color:var(--gold)}
small .zh,summary .zh{display:inline;margin-left:6px}
button,select{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #f1c588;outline-offset:2px}

/* ---------- 舞台:油画 + 光 ---------- */
#stage{position:sticky;top:0;z-index:5;height:clamp(250px,46svh,560px);overflow:hidden;background:#162b36 center/cover no-repeat;isolation:isolate}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}
#stage::after{content:"";position:absolute;inset:auto 0 0 0;height:46%;background:linear-gradient(transparent,rgba(11,22,28,.72) 62%,var(--bg));pointer-events:none}
#stage.nogl{transition:background-position 1.5s cubic-bezier(.2,.7,.2,1),background-size 1.5s cubic-bezier(.2,.7,.2,1)}
#top{position:absolute;z-index:4;inset:0 0 auto 0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top)) clamp(12px,3vw,30px) 26px;background:linear-gradient(rgba(8,16,21,.72),transparent)}
#top b{font:normal 18px var(--serif);letter-spacing:.02em;text-shadow:0 1px 10px #000;white-space:nowrap}#top button,#top select{white-space:nowrap}
#top .ctl{display:flex;gap:8px;align-items:center}
#top select,#top button{font-size:12.5px;min-height:34px;padding:5px 10px;border-radius:17px;border:1px solid rgba(231,193,136,.4);background:rgba(12,24,31,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--ink)}
#snd[aria-pressed="false"]{color:#8d9a9a;border-color:rgba(141,154,154,.35)}
/* 全息读数 */
#hud{position:absolute;z-index:3;left:0;right:0;bottom:0;padding:0 clamp(14px,3vw,34px) 14px;display:flex;align-items:flex-end;gap:16px;pointer-events:none;transform:translate3d(calc(var(--px)*-7px),calc(var(--py)*-5px),0)}
#hud .clock{font:normal clamp(44px,9vw,76px)/.95 var(--serif);letter-spacing:.01em;color:#fbf2df;text-shadow:0 0 18px rgba(140,225,255,.38),-1px 0 rgba(255,90,120,.34),1px 0 rgba(90,215,255,.38),0 2px 14px #000;font-variant-numeric:tabular-nums;display:flex}
#hud .clock i{font-style:normal;display:inline-block}
#hud .clock i.flip{animation:flip .52s cubic-bezier(.2,.8,.2,1)}
@keyframes flip{0%{transform:translateY(-42%) scaleY(.5);opacity:0;filter:blur(5px)}60%{opacity:1}100%{transform:none;filter:none}}
#hud .where{padding-bottom:7px;min-width:0}
#hud .where small{display:flex;align-items:center;gap:7px;color:var(--sea);text-shadow:0 0 10px rgba(120,230,220,.5)}
#hud .where small::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--sea);box-shadow:0 0 9px var(--sea);animation:live 2.4s ease-in-out infinite}
@keyframes live{50%{opacity:.25}}
#hud .place{font:normal clamp(17px,2.6vw,24px)/1.15 var(--serif);text-shadow:0 1px 12px #000}
#hud .place .zh{font-size:.8em}
#hud .place.swap{animation:swap .9s cubic-bezier(.2,.8,.2,1)}
@keyframes swap{0%{opacity:0;transform:translateX(18px);filter:blur(6px);letter-spacing:.2em}100%{opacity:1;transform:none;filter:none}}
.brk{position:absolute;z-index:3;width:20px;height:20px;border:1px solid rgba(159,224,210,.6);pointer-events:none;filter:drop-shadow(0 0 5px rgba(120,230,220,.55));transform:translate3d(calc(var(--px)*-11px),calc(var(--py)*-8px),0)}
.brk.a{left:12px;top:calc(54px + env(safe-area-inset-top));border-right:0;border-bottom:0}.brk.b{right:12px;top:calc(54px + env(safe-area-inset-top));border-left:0;border-bottom:0}
.brk.c{left:12px;bottom:12px;border-right:0;border-top:0}.brk.d{right:12px;bottom:12px;border-left:0;border-top:0}
#stage.shift .brk{animation:brk 1.1s cubic-bezier(.2,.8,.2,1)}
@keyframes brk{0%{opacity:0;transform:scale(1.8)}55%{opacity:1}}
#ring{position:absolute;z-index:3;left:50%;top:44%;width:10px;height:10px;margin:-5px;border-radius:50%;border:1px solid rgba(255,225,170,.9);opacity:0;pointer-events:none}
#ring.go{animation:ring 1.5s ease-out}
@keyframes ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(34)}}

/* ---------- 正文 ---------- */
main{position:relative;z-index:2;width:min(880px,100%);margin:0 auto;padding:6px clamp(12px,3vw,30px) calc(60px + env(safe-area-inset-bottom))}
article{position:relative;margin:8px 0 12px;padding:14px 18px 16px;background:linear-gradient(135deg,rgba(30,50,60,.78),rgba(18,33,41,.82));border:1px solid rgba(231,193,136,.22);border-left:2px solid var(--gold);border-radius:3px 10px 10px 3px;box-shadow:0 18px 40px -22px #000,inset 0 1px 0 rgba(255,255,255,.05);overflow:hidden}
article::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(150,230,255,.07) 46%,rgba(255,210,150,.08) 52%,transparent 66%);transform:translateX(calc(-60% + var(--px)*40%));pointer-events:none;transition:transform .5s}
article .beat{margin:0}
article .beat+.beat{margin-top:13px;padding-top:11px;border-top:1px dashed rgba(231,193,136,.28)}
article p{font:normal clamp(18px,2.7vw,25px)/1.38 var(--serif);margin:5px 0 0}
article .zh{margin-top:5px;font-size:.82em;line-height:1.55}
.w{display:inline-block;white-space:pre-wrap;opacity:0;animation:word .5s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--o,0ms) + var(--i)*1ms)}
@keyframes word{0%{opacity:0;filter:blur(7px);transform:translateY(5px);text-shadow:0 0 16px rgba(140,225,255,.9)}60%{opacity:1;text-shadow:0 0 10px rgba(255,215,160,.5)}100%{opacity:1;filter:none;transform:none;text-shadow:none}}
article.now .w{animation:none;opacity:1}
article.now small.late,article small.late{opacity:1}
.hand{display:flex;flex-wrap:wrap;gap:9px;align-items:stretch;margin:10px 0}
.hand button,[data-new]{position:relative;overflow:hidden;flex:1 1 44%;min-height:50px;text-align:left;padding:11px 14px;border-radius:5px;border:1px solid #e9c996;color:#23231f;background:linear-gradient(180deg,#f6d6a3,#e3b97c);box-shadow:0 1px 0 #fff3 inset,0 10px 22px -14px #000;transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s,filter .18s}
.hand button:first-child{background:linear-gradient(180deg,#ffe3b6,#edc58d)}
.hand button .zh,[data-new] .zh{opacity:.78}
.hand button::after,[data-new]::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 38%,rgba(255,255,255,.55) 50%,transparent 62%);transform:translateX(-120%);pointer-events:none}
.hand button:hover::after,.hand button:focus-visible::after,[data-new]:hover::after{transform:translateX(120%);transition:transform .7s}
.hand button:hover{transform:translateY(-2px);box-shadow:0 1px 0 #fff3 inset,0 16px 28px -14px #000}
.hand button:active,[data-new]:active{transform:translateY(1px) scale(.985);filter:brightness(.94)}
.rise{opacity:0;animation:rise .55s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--d,0ms) + var(--k,0)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
nav{display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid rgba(160,190,190,.18);padding-top:12px;margin-top:14px}
nav button{flex:1;min-height:48px;padding:9px 10px;border-radius:5px;border:1px solid rgba(159,224,210,.32);background:rgba(20,38,46,.55);color:var(--ink);transition:border-color .2s,background .2s,transform .18s}
nav button:hover{border-color:var(--sea);background:rgba(30,58,66,.7);transform:translateY(-1px)}
nav button .zh{font-size:.84em}
.quiet{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px}
.quiet button{border:0;background:transparent;color:#c4ccc9;font-size:14px;padding:10px 0;min-height:44px;text-align:left}
.quiet button:hover{color:var(--ink)}
details{border-top:1px solid rgba(160,190,190,.18);padding:10px 0;margin-top:8px}
summary{color:var(--sea);cursor:pointer;min-height:30px}
details p{margin:8px 0;color:#dfe6e2;font-size:15px}
details[open]>p{animation:rise .4s both}
.paper{position:relative;background:linear-gradient(175deg,#efe5cf,#e3d6ba);color:#35362e;padding:19px 22px;margin:12px 0;border-radius:2px;box-shadow:0 26px 50px -26px #000;transform-origin:50% 0;animation:paper .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes paper{from{opacity:0;transform:translateY(40px) rotate(-1.2deg)}to{opacity:1;transform:none}}
.paper small{color:#785e42}.paper h2{font:normal 27px var(--serif);margin:3px 0 10px}.paper h3{font:600 10.5px/1.4 var(--mono);letter-spacing:.16em;color:#8a6f4a;margin:16px 0 2px}.paper h3 .zh{display:inline;margin-left:6px;opacity:.9}.paper .basis{font:normal 16px/1.45 var(--serif);margin:5px 0 2px}.paper .basis .zh{font-size:.9em}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px dashed #b9ac95;padding:6px 0}
.row b{font:600 17px var(--mono);animation:stamp .45s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(700ms + var(--k)*230ms)}
@keyframes stamp{from{opacity:0;transform:scale(2.3) rotate(-8deg)}to{opacity:1;transform:none}}
.note{font-size:14px;color:var(--dim)}

/* ---------- 开场 ---------- */
#veil{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end;padding:0 clamp(18px,5vw,60px) calc(34px + env(safe-area-inset-bottom));background:linear-gradient(rgba(8,16,21,.2),rgba(8,16,21,.55) 45%,rgba(8,16,21,.96));transition:opacity .9s,visibility .9s}
#veil.gone{opacity:0;visibility:hidden;pointer-events:none}
#veil h1{font:normal clamp(38px,8vw,72px)/1.02 var(--serif);margin:6px 0 4px;text-shadow:0 0 26px rgba(140,225,255,.3),-1px 0 rgba(255,90,120,.3),1px 0 rgba(90,215,255,.34)}
#veil h1 span{display:block;font-size:.5em;letter-spacing:.3em;margin-top:8px;opacity:.9}
#veil p{max-width:30em;color:#d9e0dc;margin:10px 0 18px;font:normal 17px/1.5 var(--serif)}
#veil .go{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#veil .go button{min-height:50px;padding:11px 20px;border-radius:26px;border:1px solid #e9c996;background:linear-gradient(180deg,#f6d6a3,#e3b97c);color:#23231f;font-weight:600}
#veil .go button+button{background:transparent;color:var(--ink);border-color:rgba(231,193,136,.45);font-weight:400}
#stage.veiled{position:fixed;inset:0;height:100dvh;z-index:20}
#stage.veiled #top,#stage.veiled #hud,#stage.veiled .brk{opacity:0}
#top,#hud,.brk{transition:opacity .8s .3s}

@media(min-width:900px){#stage{height:clamp(300px,54svh,620px)}}
@media(max-width:580px){.hand button{flex:1 1 100%}nav button{font-size:14px}article{padding:12px 14px 14px}#top b{font-size:16px}#top b span{display:none}}
@media(prefers-reduced-motion:reduce){.w,.rise,.row b,.paper{animation:none!important;opacity:1}#hud .clock i.flip,#hud .place.swap,#stage.shift .brk,#ring.go,#hud .where small::before{animation:none}}
</style></head><body>
<div id="stage" class="veiled"><canvas id="gl"></canvas><canvas id="fx"></canvas>
<div id="top"><b>Night Shift<span> · 港城夜班</span></b><span class="ctl"><button id="snd" aria-pressed="false" aria-label="Sound / 声音">♪ Off</button><select id="language" aria-label="Language / 语言"><option value="dual">English + 中文</option><option value="en">English</option><option value="zh">中文</option></select></span></div>
<i class="brk a"></i><i class="brk b"></i><i class="brk c"></i><i class="brk d"></i><i id="ring"></i>
<div id="hud"><div class="clock" id="clock" aria-label="clock"></div><div class="where"><small>PORT MERIDIAN</small><div class="place" id="place"></div></div></div></div>
<div id="veil"><small>PORT MERIDIAN · NIGHT DESK</small><h1>Night Shift<span>港城夜班</span></h1><p id="vp"></p><div class="go"><button id="vgo"></button><button id="vmute"></button></div></div>
<main><div id="game"></div></main>
<script>const pack=(en,zh)=>[en,zh];
function initial(seed){return {seed,t:0,place:'box',open:false,route:0,read:-1,holds:0,depart:[],seen:{},pending:[],log:[],notes:[],cash:10,charges:0,claims:0,reserved:0,key:true,lift:'',price:null,offers:0,orders:0,settled:false,clocked:false,last:pack('Rain. Someone is knocking with the heel of a shoe.','雨。有人拿鞋跟敲门。')}}
const original=(s,i)=>i<2?[6,4][i]:s.seed%2?4:6;
const firstLoaded=s=>Boolean(s.seed&2);
const newEpoch=s=>Boolean(s.seed&4);
const fair=s=>s.seed&8?7:5;
function record(s,msg){s.last=msg;s.log.push([s.t,msg]);}
function queue(s,after,kind,val){s.pending.push({at:s.t+after,kind,val})}
function arrive(s,e){
 if(e.kind==='train'){let d=s.depart[e.val],wrong=d.pier!==original(s,e.val);d.arrived=true;d.wrong=wrong;
 return wrong?pack('A cart of peaches has arrived at Six. At Four, Mara is still holding the empty baskets. “My copy was right when I made it.”','一车桃子到了六码头。玛拉还在四码头抱着空筐。「我抄的时候，纸上就是这么写的。」'):pack('A porter rolls the fruit off at Pier '+d.pier+'. A bruised peach finds its way back to your desk.','搬运工在'+d.pier+'号码头卸下水果。一只磕伤的桃子被送回了你的桌上。')}
 if(e.kind==='fork')return s.claims>1?pack('Two crews show up for the same forklift. June hands the second crew a broom. A train waits behind them.','两队人拿着条子来领同一辆叉车。琼递给第二队一把扫帚。后面一列车开始等。'):pack('One forklift rattles down the quay. Its reverse bell plays the first three notes of a waltz.','叉车沿岸开走。倒车铃恰好是圆舞曲的头三个音。');
 if(e.kind==='quote'){let move=fair(s);let pnl=(move-e.val)*s.orders;s.cash+=pnl;return pack('The shore bulletin finally prints '+move+'. Your bid was '+e.val+'. '+s.orders+' sellers took it. Net change '+(pnl>=0?'+':'')+pnl+' coins.','岸台行情终于印出来了：'+move+' 枚。你挂了 '+e.val+' 枚，来了 '+s.orders+' 个卖家。钱匣净变动 '+pnl+' 枚。')}
 if(e.kind==='cab')return e.val?pack('Two cabs pull the same lever. Sol’s brass key still fits. June catches the points before the second axle.','两个驾驶室同时拉杆。索尔那把黄铜钥匙依然插得进去。琼赶在第二根车轴前稳住道岔。'):pack('One lever moves. Sol puts his gloves on the radiator.','只有一根拉杆在动。索尔把手套搁上暖气片。');
 return pack('The bell rings.','铃响了。')
}
function tick(s,n=1){for(let j=0;j<n;j++){s.t++;for(const e of s.pending.filter(e=>e.at<=s.t))record(s,arrive(s,e));s.pending=s.pending.filter(e=>e.at>s.t)}}
function stamp(s,k){s.seen[k]=s.t+1}
function actions(s){
 if(!s.open)return ['ledger'];
 if(s.clocked)return [];
 let a=[];
 if(s.place==='box'){
 if(s.route<3){a.push('tube','driver','hold');if(s.read===s.route)a.push('original')}
 if(s.t>=5&&!s.seen.freight)a.push('bell');
 if(s.seen.freight&&!s.settled)a.push('crate','stub');
 if(s.t>=11&&!s.seen.driver)a.push('oldkey','brass');
 if(s.t>=22&&!s.seen.wire)a.push('secondwire','oldwire','shorewire');
 if(s.t>=18&&!s.seen.agent)a.push('badge','agentbook');
 if(s.seen.agentbook&&!s.seen.agent)a.push('livebadge');
 }
 if(s.place==='quay'){
 a.push('window');if(!s.seen.gossip)a.push('forkgossip');
 if(s.seen.forkgossip&&!s.lift&&s.claims<2)a.push('promise');if(s.claims===1&&!s.lift)a.push('tag');
 if(s.t>=10&&!s.seen.settleread)a.push('count');
 if(s.t>=15&&!s.seen.cashpaid)a.push('deed','coins');
 if(s.t>=16&&s.price===null)a.push('weather','bid5','bid7');
 }
 if(s.place==='records'){
 if(s.route<3)a.push('vault');if(s.seen.freight)a.push('journal');
 if(s.t>=11)a.push('roster');
 if(s.t>=15)a.push('drawer');
 if(s.t>=20&&s.reserved<2&&!s.seen.matched)a.push('bookcredit','pencil');
 }
 if(s.place==='kitchen'){a.push('tea','radio','gossip');}
 a.push('pass');if(s.t>=25)a.push('dawn');
 return a;
}
function play(s,id){
 if(!actions(s).includes(id))return false;
 let m,n=1;const say=(en,zh)=>m=pack(en,zh);
 switch(id){
 case 'ledger':s.open=true;say('The ledger says FOUR. A damp copy in the tube says SIX. Mara taps the date on the ledger: yesterday. “Can you take the first fruit train?”','账本写着「四」。气动管里湿漉漉的抄件写着「六」。玛拉点点账页上的日期：昨天。「第一班水果车，你来送？」');n=0;break;
 case 'tube':say('A blue slip for car '+(s.route+1)+'. Pier '+[6,4,6][s.route]+'. Mara’s thumbprint smudges the carbon.','第 '+(s.route+1)+' 车的蓝色复写联。'+[6,4,6][s.route]+'号码头。玛拉的拇指把复写墨蹭花了。');break;
 case 'vault':s.read=s.route;say('The register for car '+(s.route+1)+' reads Pier '+original(s,s.route)+'. '+(s.route===2&&s.seed%2?'Six was crossed out six minutes ago.':'The shore seal is still wet.'),'第 '+(s.route+1)+' 车的原簿写着「'+original(s,s.route)+'号码头」。'+(s.route===2&&s.seed%2?'六分钟前，六码头那行被划掉了。':'岸台的印泥还湿着。'));break;
 case 'original':case 'driver':{let i=s.route++,pier=id==='original'?original(s,i):[6,4,6][i];s.depart.push({pier,via:id,arrived:false});queue(s,3+s.holds,'train',i);say('You pass the driver the '+(id==='original'?'registry page':'blue copy')+'. Car '+(i+1)+' disappears toward Pier '+pier+'. The tube rattles again.','你把'+(id==='original'?'原簿签页':'蓝色复写联')+'递进车窗。第 '+(i+1)+' 车消失在去'+pier+'号码头的弯道后。气动管又响了。');break}
 case 'hold':s.holds++;say('You raise the red lamp. Behind the fruit car, a milk train pulls up and kills its engine.','你举起红灯。水果车身后，一列牛奶车停下，熄了火。');break;
 case 'bell':stamp(s,'freight');say('Inez whispers, “K17. I lost the answering bell. Did that crate leave?” Through the fog you can hear a chain, then nothing.','伊内斯压低声音：「K17。回铃断了。那箱货到底走了吗？」雾里传来一阵链条声，然后什么也听不见。');break;
 case 'window':if(s.seen.freight){stamp(s,'witness');say(firstLoaded(s)?'The K17 outline on the scale is dry. Its pallet went through before the rain.':'K17 is still on the scale. Rain beads on its brass strap.',firstLoaded(s)?'秤台上 K17 的箱印是干的。雨来之前托盘就已经走了。':'K17 还在秤台上。铜箍上挂着雨珠。')}else say('A milk wagon carries a single upright piano. Nobody on the platform will explain.','一节奶车里装着一架立式钢琴。站台上谁都不肯解释。');break;
 case 'journal':stamp(s,'witness');say(firstLoaded(s)?'K17: one departure stamped. The bell column is empty.':'K17: scale occupied; departure stamp missing.',firstLoaded(s)?'K17：发车章一枚。回铃那栏空着。':'K17：占用秤台。发车章那格空着。');break;
 case 'crate':case 'stub':s.charges=Number(firstLoaded(s))+Number(id==='crate');s.settled=true;stamp(s,id);say(id==='crate'?'You slide a fresh loading ticket to Inez. She hangs it on the hook beside K17.':'You file the stub. Nobody at the crane receives a new order.',id==='crate'?'你递出新装货条。伊内斯把它挂在 K17 旁边。':'你把存根夹好。吊车那边没收到新工单。');break;
 case 'forkgossip':stamp(s,id);say('“I promised Liv the forklift.” “So did I. Only I promised it to my brother.” June waits for you to stop laughing.','「我把叉车答应给莉芙了。」「我也是。只不过我答应的是我哥。」琼等着你笑完。');break;

initial=function(seed){const s=_initial(seed),done=firstLoaded(s)?1:0;
 s.k={done,gone:done===1,goneAt:done?-1:null,q:[{at:V4.RETRY,kind:'retry'}],frozen:false,held:[],retryOff:false,auto:false,runner:false,snap:null,know:null,basis:null,mode:'none',late:false,fee:0,demur:0,closed:false,fired:[]};
 if(!done&&k17late(s))s.k.q.push({at:k17at(s),kind:'orig'});return s};
const k17live=s=>!s.k.frozen&&s.k.q.some(e=>e.kind==='orig'||e.kind==='fresh');
const k17view=s=>({gone:s.k.gone,dry:s.k.gone&&s.k.goneAt<0,queue:k17live(s),hold:s.k.frozen&&!s.k.gone});
function k17fire(s,e){const k=s.k;
 if(e.kind==='retry'){if(k.retryOff||k.frozen)return;k.retryOff=true;k.auto=true;k.q.push({at:s.t+2,kind:'fresh'});record(s,K17.retry);k.fired.push('retry');return}
 if(e.kind==='count'){if(k.frozen)return;if(!k.gone&&!k17live(s)){k.done++;k.gone=true;k.goneAt=s.t;record(s,K17.countLoad);k.fired.push('go')}else if(k.gone){record(s,K17.countSeen);k.fired.push('count')}if(s.settled)s.charges=k.done;return}
 if(e.kind==='look'){k.snap=Object.assign({t:s.t},k17view(s));return}
 if(e.kind==='report'){const v=k.snap;k.know={t:v.t,src:'runner',gone:v.gone,queue:v.queue};s.seen.witness=s.t+1;record(s,v.gone?(v.dry?K17.repDry:K17.repWet):v.hold?K17.repHold:v.queue?K17.repQueue:K17.repNone);k.fired.push('report');return}
 if(k.frozen){k.held.push(e.kind);record(s,K17.held);k.fired.push('held');return}
 k.done++;if(!k.gone){k.gone=true;k.goneAt=s.t;if(s.t>V4.TIDE)k.late=true;record(s,e.kind==='orig'?K17.origGo:K17.freshGo);k.fired.push('go')}else{record(s,e.kind==='orig'?K17.origDup:K17.freshDup);k.fired.push('dup')}
 if(s.settled)s.charges=k.done}
function k17run(s,all){const k=s.k;for(;;){const due=k.q.filter(e=>all||e.at<=s.t).sort((a,b)=>a.at-b.at)[0];if(!due)return;k.q.splice(k.q.indexOf(due),1);k17fire(s,due)}}
tick=function(s,n=1){for(let j=0;j<n;j++){_tick(s,1);if(s.k&&!s.k.closed)k17run(s)}};
function k17close(s){const k=s.k;if(!s.clocked||k.closed)return;k.retryOff=true;k17run(s,true);k.frozen=false;k.held=[];
 if(!k.gone){k.done++;k.gone=true;k.goneAt=s.t;k.late=true}
 if(k.late){k.demur=chance(s.seed,17)<.5?V4.DEMUR:0;s.cash-=k.demur;record(s,k.demur?K17.lateFull:K17.lateFree);k.fired.push('late')}
 if(k.done>1){k.fee=V4.DUPFEE*(k.done-1);s.cash-=k.fee;record(s,K17.dup(k.done));k.fired.push('fee')}else if(!k.late){record(s,K17.countOk);k.fired.push('count')}
 s.settled=true;s.charges=k.done;k.closed=true}
actions=function(s){const a=_actions(s);if(!s.k||!s.open||s.clocked)return a;const k=s.k;
 if(s.place==='box'&&s.seen.freight){const add=[];if(!s.settled){if(!k.frozen)add.push('k17hold');add.push('k17wait');if(!k.runner&&s.cash-s.reserved>=V4.RUNNER)add.push('k17runner')}if(k.frozen)add.push('k17lift');a.splice(a.indexOf('pass'),0,...add)}
 return a};
function k17finish(s,m,n){record(s,m);tick(s,n);if(s.t>=34||s.clocked){while(s.pending.length)tick(s);s.clocked=true}k17close(s);return true}
function k17basis(s,act){const k=s.k,w=k.know;k.basis={act,t:s.t,src:w?w.src:'none',age:w?s.t-w.t:null,queue:w?w.queue:null,gone:w?w.gone:null}}
play=function(s,id){if(!s.k)return _play(s,id);if(!actions(s).includes(id))return false;const k=s.k;k.fired=[];
 switch(id){
 case 'k17hold':k.frozen=true;if(!k.basis)k17basis(s,'hold');stamp(s,'k17hold');return k17finish(s,K17.hold,1);
 case 'k17lift':k.frozen=false;k.held.forEach((kind,i)=>k.q.push({at:s.t+1+i,kind}));k.held=[];return k17finish(s,K17.lift,1);
 case 'k17wait':k.retryOff=true;k.mode='wait';k17basis(s,'wait');s.holds++;k.q.push({at:Math.max(V4.COUNT,s.t+1),kind:'count'});s.settled=true;s.charges=k.done;stamp(s,'k17wait');return k17finish(s,K17.wait,1);
 case 'k17runner':s.cash-=V4.RUNNER;k.runner=true;k.q.push({at:s.t+1,kind:'look'},{at:s.t+2,kind:'report'});return k17finish(s,K17.runner,1);
 case 'window':case 'journal':if(s.seen.freight){const book=id==='journal';
   if(k17fog(s))return k17finish(s,book?K17.bookFog:K17.winFog,1);
   const v=k17view(s);k.know={t:s.t,src:book?'book':'scale',gone:v.gone,queue:v.queue};
   if(v.hold){stamp(s,'witness');return k17finish(s,book?K17.bookHold:K17.winHold,1)}
   if(v.gone&&!v.dry){stamp(s,'witness');return k17finish(s,book?K17.bookWet:K17.winWet,1)}
   if(!v.gone&&v.queue){stamp(s,'witness');return k17finish(s,book?K17.bookQueue:K17.winQueue,1)}}break;
 case 'crate':k.retryOff=true;k.mode='crate';k17basis(s,'crate');k.q.push({at:s.t+2,kind:'fresh'});break;
 case 'stub':k.retryOff=true;k.mode='stub';k17basis(s,'stub');break;
 }
 const r=_play(s,id);if(r){if(s.settled)s.charges=k.done;k17close(s)}return r};
walk=function(s,p){if(!s.k)return _walk(s,p);const f=s.k.fired;s.k.fired=[];const r=_walk(s,p);if(r)k17close(s);else s.k.fired=f;return r};
discoveries=function(s){const a=_discoveries(s),k=s.k;if(!k||!k.closed)return a;
 if(!firstLoaded(s)&&k17late(s)&&k.done===1&&!k.late&&k.basis&&k.basis.queue===true)a.push(['In flight','在途','The bell was lost. The order was not. You saw the slip in the queue and let it arrive.','丢的是回铃，不是那张单子。你看见它还挂在队列里，就让它自己到了。']);
 if(k17fog(s)&&k.done===1&&(s.seen.k17hold||k.runner))a.push(['Bounded unknown','有界的未知','You could not see the scale. You picked a move you could take back, or paid to find out.','你看不见秤台。你选了一步还能收回的棋，或者花钱去弄清楚。']);
 return a};
/* What the morning carbon says about K17, kept with the rules so the words stay in one place. */
function k17report(s){const k=s.k,b=k.basis,min=n=>n===1?'1 minute':n+' minutes';
 const did={crate:['wrote a fresh ticket','另开了一张装货单'],stub:['filed it as done','当它已经走了，收了存根'],wait:['held the scale for the five o’clock count','让秤台原样等到五点数底联'],hold:['chalked HOLD and went no further','写了个「停」，没再往下做']};
 let basis;if(!b)basis=k.auto?pack('You never answered. Inez replayed it herself.','你一直没回话。伊内斯自己重发了。'):pack('You never answered the bell.','你一直没接那声铃。');
 else{const src=b.src==='none'?['a lost bell and nothing else','一声没回的铃，别的什么都没有']:b.src==='runner'?['a runner’s word, '+min(b.age)+' old','跑腿的一句话，已经过了 '+b.age+' 分钟']:b.src==='book'?['the weighbook as you read it '+min(b.age)+' earlier',b.age+' 分钟前读到的秤簿']:['the scale as you saw it '+min(b.age)+' earlier',b.age+' 分钟前亲眼看到的秤台'];
  basis=pack('You '+did[b.act][0]+', going on '+src[0]+'.','你'+did[b.act][1]+'，凭的是'+src[1]+'。')}
 return{basis,entries:k.done,late:k.late,demur:k.demur,fee:k.fee,open:!b}}
</script>
